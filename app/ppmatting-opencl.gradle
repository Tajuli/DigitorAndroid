// PP-MattingV2 GPU backend for Android.
//
// Paddle Lite OpenCL was process-fatal on the target Symphony Z60 / UNISOC T606 firmware. V70
// packages four genuine fixed ncnn Vulkan graph params (256/320/384/512), but stores their
// byte-identical fp16 weight blob only once. Runtime still loads exactly the user-selected fixed
// graph; there is no engine or tensor-size transition during an analysis run.

import java.security.MessageDigest


def generatedRoot = file("${buildDir}/generated/ppmattingNcnnVulkan")
def downloadsDir = file("${generatedRoot}/downloads")
def pnnxExtractDir = file("${generatedRoot}/pnnxExtract")
def toolsDir = file("${generatedRoot}/tools")

def osName = (System.getProperty("os.name") ?: "").toLowerCase(Locale.ROOT)
def isWindowsHost = osName.contains("windows")
def isMacHost = osName.contains("mac") || osName.contains("darwin")
def pnnxArchiveName = isWindowsHost ? "pnnx-20260526-windows.zip" : (isMacHost ? "pnnx-20260526-macos.zip" : "pnnx-20260526-linux.zip")
def pnnxExecutableName = isWindowsHost ? "pnnx.exe" : "pnnx"
def pnnxTool = file("${toolsDir}/${pnnxExecutableName}")
def ncnnExtractDir = file("${generatedRoot}/ncnnExtract")
def ncnnRuntimeRoot = file("${generatedRoot}/ncnnRuntime")
def optimizedAssetsDir = file("${generatedRoot}/assets")

def fallback512Onnx = file("${buildDir}/generated/ppMattingV2Assets/ppmattingv2_stdc1_human_512.onnx")
def true256Onnx = file("${buildDir}/generated/ppMattingV2True256/ppmattingv2_stdc1_human_256.onnx")
def true320Onnx = file("${buildDir}/generated/ppMattingV2True320/ppmattingv2_stdc1_human_320.onnx")
def true384Onnx = file("${buildDir}/generated/ppMattingV2True384/ppmattingv2_stdc1_human_384.onnx")
def modelSizes = [256, 320, 384, 512]
def sourceOnnxBySize = [
        256: true256Onnx,
        320: true320Onnx,
        384: true384Onnx,
        512: fallback512Onnx,
]

def outputParamFor = { int size -> file("${optimizedAssetsDir}/ppmattingv2_stdc1_human_vulkan_${size}.ncnn.param") }
def outputBinFor = { int size -> file("${optimizedAssetsDir}/ppmattingv2_stdc1_human_vulkan_${size}.ncnn.bin") }
def outputProfileFor = { int size -> file("${optimizedAssetsDir}/ppmattingv2_stdc1_human_vulkan_${size}.profile") }
def sharedWeightsBin = file("${optimizedAssetsDir}/ppmattingv2_stdc1_human_vulkan_shared.ncnn.bin")

// Keep converter and Android runtime on the exact same ncnn generation.
def pnnxZip = file("${downloadsDir}/${pnnxArchiveName}")
def ncnnZip = file("${downloadsDir}/ncnn-20260526-android-vulkan.zip")

def pnnxUrl = "https://github.com/pnnx/pnnx/releases/download/20260526/${pnnxArchiveName}"
def ncnnUrl = "https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-android-vulkan.zip"

def pnnxSha256 = isWindowsHost ? "4e188e7606c887ac550820322f34b144140df877b73292b25e48a2ba38f297df" :
    (isMacHost ? "49f942bba47e0a6bbb971506f7beec73c12a7e5b74c7a90522eced006ca299d0" :
        "dde08ce2e2e1744a4ddce576910b451a860663af91d2aeed0d21ebee4fa69955")
def ncnnSha256 = "26909c92eed35afed4a966b5e9e503fcb0a529691ea3f910ec2c94a4fff52804"

def sha256Of = { File source ->
    MessageDigest digest = MessageDigest.getInstance("SHA-256")
    source.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = input.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join("")
}

def downloadWithRetry = { source, target, minimumBytes, expectedSha256 ->
    long minBytes = (minimumBytes as Number).longValue()
    File targetFile = target as File
    String sourceUrl = source.toString()
    String expected = expectedSha256 == null ? null : expectedSha256.toString()

    if (targetFile.isFile() && targetFile.length() > minBytes) {
        if (expected == null || sha256Of(targetFile).equalsIgnoreCase(expected)) return
        targetFile.delete()
    }

    targetFile.parentFile.mkdirs()
    File tmp = new File(targetFile.parentFile, targetFile.name + ".download")
    Throwable last = null
    for (int attempt = 1; attempt <= 5; attempt++) {
        try {
            if (tmp.exists()) tmp.delete()
            def connection = new URL(sourceUrl).openConnection()
            connection.setConnectTimeout(30000)
            connection.setReadTimeout(240000)
            connection.setRequestProperty("User-Agent", "DigitorAndroid-build/1.0")
            connection.getInputStream().withCloseable { input ->
                tmp.withOutputStream { out -> out << input }
            }
            if (tmp.length() <= minBytes) {
                throw new GradleException("Downloaded ${targetFile.name} is unexpectedly small (${tmp.length()} bytes)")
            }
            if (expected != null) {
                String actual = sha256Of(tmp)
                if (!actual.equalsIgnoreCase(expected)) {
                    throw new GradleException("${targetFile.name} SHA-256 mismatch: expected ${expected}, got ${actual}")
                }
            }
            if (targetFile.exists()) targetFile.delete()
            if (!tmp.renameTo(targetFile)) {
                targetFile.bytes = tmp.bytes
                tmp.delete()
            }
            return
        } catch (Throwable error) {
            last = error
            if (tmp.exists()) tmp.delete()
            if (attempt < 5) {
                sleep(Math.min(20000L, 2000L * (1L << (attempt - 1))))
            }
        }
    }
    throw new GradleException("Could not download ${sourceUrl}", last)
}

tasks.register("preparePnnxForPpMatting") {
    outputs.file(pnnxTool)
    doLast {
        downloadsDir.mkdirs()
        downloadWithRetry(pnnxUrl, pnnxZip, isWindowsHost ? 15_000_000L : 20_000_000L, pnnxSha256)
        delete(pnnxExtractDir)
        pnnxExtractDir.mkdirs()
        copy {
            from zipTree(pnnxZip)
            into pnnxExtractDir
        }

        File detected = fileTree(pnnxExtractDir).files.find { candidate ->
            candidate.isFile() && candidate.name.equalsIgnoreCase(pnnxExecutableName)
        }
        if (detected == null) {
            throw new GradleException("pnnx release archive did not contain ${pnnxExecutableName} for host ${System.getProperty('os.name')}")
        }

        delete(toolsDir)
        toolsDir.mkdirs()
        copy {
            from detected
            into toolsDir
            rename { pnnxExecutableName }
        }
        if (!isWindowsHost) pnnxTool.setExecutable(true)
        if (!pnnxTool.isFile() || pnnxTool.length() < 5_000_000L) {
            throw new GradleException("Could not materialize pnnx converter at ${pnnxTool}")
        }
    }
}

tasks.register("prepareNcnnVulkanRuntime") {
    outputs.file(new File(ncnnRuntimeRoot, "arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake"))
    doLast {
        downloadsDir.mkdirs()
        downloadWithRetry(ncnnUrl, ncnnZip, 25_000_000L, ncnnSha256)
        delete(ncnnExtractDir)
        ncnnExtractDir.mkdirs()
        copy {
            from zipTree(ncnnZip)
            into ncnnExtractDir
        }

        File arm64Config = fileTree(ncnnExtractDir).matching {
            include "**/arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake"
        }.files.find { true }
        if (arm64Config == null) {
            throw new GradleException("ncnn Android Vulkan archive did not contain arm64-v8a ncnnConfig.cmake")
        }

        File detectedRoot = arm64Config.parentFile.parentFile.parentFile.parentFile.parentFile
        delete(ncnnRuntimeRoot)
        ncnnRuntimeRoot.mkdirs()
        copy {
            from detectedRoot
            into ncnnRuntimeRoot
        }

        File normalized = new File(ncnnRuntimeRoot, "arm64-v8a/lib/cmake/ncnn/ncnnConfig.cmake")
        if (!normalized.isFile()) {
            throw new GradleException("Could not normalize ncnn Vulkan runtime under ${ncnnRuntimeRoot}")
        }
    }
}

def allModelOutputs = modelSizes.collectMany { int size ->
    [outputParamFor(size), outputProfileFor(size)]
} + [sharedWeightsBin]

tasks.register("preparePpMattingNcnnModels") {
    dependsOn("downloadPpMattingV2Model", "preparePnnxForPpMatting")
    inputs.files(sourceOnnxBySize.values())
    outputs.files(allModelOutputs)
    doLast {
        modelSizes.each { int size ->
            File source = sourceOnnxBySize[size] as File
            if (!source.isFile() || source.length() < 5_000_000L) {
                throw new GradleException(
                    "Fixed PP-MattingV2 ${size} ONNX is missing: ${source}. " +
                    "CI exports 256/320/384 before Gradle; 512 is the pinned downloaded fallback source."
                )
            }
        }

        delete(optimizedAssetsDir)
        optimizedAssetsDir.mkdirs()

        modelSizes.each { int size ->
            File source = sourceOnnxBySize[size] as File
            File outputParam = outputParamFor(size)
            File outputBin = outputBinFor(size)
            File outputProfile = outputProfileFor(size)

            fileTree(source.parentFile).matching { include "*.pnnxsim.onnx" }.files.each { it.delete() }

            def pnnxArgs = [
                pnnxTool.absolutePath,
                source.absolutePath,
                "fp16=1",
                "ncnnparam=${outputParam.absolutePath}",
                "ncnnbin=${outputBin.absolutePath}",
                "pnnxparam=${new File(generatedRoot, "ppmatting_${size}.pnnx.param").absolutePath}",
                "pnnxbin=${new File(generatedRoot, "ppmatting_${size}.pnnx.bin").absolutePath}",
                "pnnxpy=${new File(generatedRoot, "ppmatting_${size}_pnnx.py").absolutePath}",
                "pnnxonnx=${new File(generatedRoot, "ppmatting_${size}.pnnx.onnx").absolutePath}",
                "ncnnpy=${new File(generatedRoot, "ppmatting_${size}_ncnn.py").absolutePath}",
            ]

            def execResult = providers.exec {
                workingDir generatedRoot
                commandLine pnnxArgs
            }.result.get()
            execResult.assertNormalExitValue()

            fileTree(source.parentFile).matching { include "*.pnnxsim.onnx" }.files.each { it.delete() }

            if (!outputParam.isFile() || outputParam.length() < 1_000L) {
                throw new GradleException("pnnx did not create ${outputParam}")
            }
            if (!outputBin.isFile() || outputBin.length() < 5_000_000L) {
                throw new GradleException("pnnx did not create a valid ${outputBin}")
            }
            outputProfile.text = "PP-MattingV2 STDC1 fixed ${size}x${size}\nsource=${source.name}\nweights=official-human-512-stable\npnnx=20260526\nncnn=20260526\n"
            logger.lifecycle("PP-MattingV2 Vulkan profile ready: fixed ${size}x${size} from ${source.name}")
        }

        // Fixed input shape changes only the ncnn graph param. With the same official STDC1 human
        // checkpoint and fp16 conversion, pnnx emits the exact same weight blob for all four sizes.
        // Verify that invariant every build before deduplicating so a future converter/model change
        // can never silently pair a graph with the wrong weights.
        def generatedBins = modelSizes.collect { int size -> outputBinFor(size) }
        def weightHashes = generatedBins.collect { File bin -> sha256Of(bin) }.toSet()
        if (weightHashes.size() != 1) {
            throw new GradleException(
                "PP-MattingV2 fixed graphs no longer share byte-identical ncnn weights; refusing unsafe APK deduplication"
            )
        }

        File canonicalWeights = outputBinFor(512)
        copy {
            from canonicalWeights
            into optimizedAssetsDir
            rename { sharedWeightsBin.name }
        }
        if (!sharedWeightsBin.isFile() || sharedWeightsBin.length() < 5_000_000L) {
            throw new GradleException("Could not create shared PP-MattingV2 ncnn weights asset")
        }
        generatedBins.each { File bin ->
            if (bin.absolutePath != sharedWeightsBin.absolutePath && bin.exists()) bin.delete()
        }
        logger.lifecycle(
            "PP-MattingV2 APK dedupe: 256/320/384/512 params share one ${sharedWeightsBin.name} " +
            "(${String.format('%.1f', sharedWeightsBin.length() / 1024.0 / 1024.0)} MiB)"
        )
    }
}

def prepareGpu = tasks.register("preparePpMattingNcnnVulkanGpu") {
    dependsOn("preparePpMattingNcnnModels", "prepareNcnnVulkanRuntime")
}

android {
    ndkVersion "29.0.14206865"

    defaultConfig {
        externalNativeBuild {
            cmake {
                arguments "-DNCNN_ANDROID_ROOT=${ncnnRuntimeRoot.absolutePath}"
                cppFlags "-std=c++17 -O3 -ffast-math"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets.main.assets.srcDir(optimizedAssetsDir)
}

tasks.matching { task ->
    def n = task.name.toLowerCase(Locale.ROOT)
    n.contains("cmake") || n == "prebuild" || (n.contains("merge") && n.contains("native"))
}.configureEach {
    dependsOn(prepareGpu)
}
