name: Patch PR57 V61 residual corruption

on:
  push:
    branches: [ perf/ppmattingv2-gpu-128-v57 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ppmattingv2-gpu-128-v57
          fetch-depth: 0
      - name: Apply V61 source/base/refined matte guards and CI fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          portrait_path = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/PortraitMatteBackendV50.kt')
          portrait = portrait_path.read_text()
          portrait = portrait.replace('isIntrinsicAlphaSaneV60', 'isIntrinsicAlphaSaneV61')
          portrait = replace_exact(
              portrait,
              '''    private fun isIntrinsicAlphaSaneV61(alpha: FloatArray): Boolean {\n        if (alpha.size < plane) return false\n        val grid = FloatArray(GUARD_SIDE_V60 * GUARD_SIDE_V60)\n''',
              '''    private fun isIntrinsicAlphaSaneV61(alpha: FloatArray): Boolean {\n        if (alpha.size < plane) return false\n        // V60's 48x48 grid could step over a one/few-pixel driver stripe. Scan every\n        // native 512 alpha row/column first, then retain the broader sampled checks below.\n        if (hasWideBandAlphaArtifactV61(alpha)) return false\n        val grid = FloatArray(GUARD_SIDE_V60 * GUARD_SIDE_V60)\n''',
              'portrait full-resolution guard hook',
          )
          helper = '''\n    /** Detect thin full-width/full-height OpenCL tile bands that a sparse grid can miss. */\n    private fun hasWideBandAlphaArtifactV61(alpha: FloatArray): Boolean {\n        if (alpha.size < plane) return true\n        val rowCoverage = (MODEL_SIZE * .58f).roundToInt().coerceAtLeast(1)\n        val columnCoverage = rowCoverage\n\n        for (y in 1 until MODEL_SIZE) {\n            val previous = (y - 1) * MODEL_SIZE\n            val current = y * MODEL_SIZE\n            var severe = 0\n            var deltaSum = 0f\n            for (x in 0 until MODEL_SIZE) {\n                val a = alpha[previous + x]\n                val b = alpha[current + x]\n                if (!a.isFinite() || !b.isFinite()) return true\n                val delta = abs(a.coerceIn(0f, 1f) - b.coerceIn(0f, 1f))\n                deltaSum += delta\n                if (delta >= .50f) severe++\n            }\n            if (severe >= rowCoverage && deltaSum / MODEL_SIZE.toFloat() >= .22f) return true\n        }\n\n        for (x in 1 until MODEL_SIZE) {\n            var severe = 0\n            var deltaSum = 0f\n            for (y in 0 until MODEL_SIZE) {\n                val a = alpha[y * MODEL_SIZE + x - 1]\n                val b = alpha[y * MODEL_SIZE + x]\n                if (!a.isFinite() || !b.isFinite()) return true\n                val delta = abs(a.coerceIn(0f, 1f) - b.coerceIn(0f, 1f))\n                deltaSum += delta\n                if (delta >= .50f) severe++\n            }\n            if (severe >= columnCoverage && deltaSum / MODEL_SIZE.toFloat() >= .22f) return true\n        }\n        return false\n    }\n'''
          portrait = replace_exact(
              portrait,
              '    private fun isTemporallyPlausibleV60(\n',
              helper + '\n    private fun isTemporallyPlausibleV60(\n',
              'portrait V61 helper insertion',
          )
          portrait = portrait.replace(
              ' * V60 additionally guards the OpenCL *base* matte itself.',
              ' * V61 strengthens the OpenCL *base* matte guard after V60.',
          )
          portrait_path.write_text(portrait)

          analyzer_path = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/GpuPersonCutoutAnalyzerV47.kt')
          analyzer = analyzer_path.read_text()
          analyzer = replace_exact(
              analyzer,
              '''            val sequentialResult = runCatching {\n                GpuSequentialCutoutDecoderV47(context, PERSON_ANALYSIS_LONG_EDGE_V47).decodeTargets(\n''',
              '''            // V61 verifies the decoded OES frame itself before PP-MattingV2. A corrupt\n            // decoder/readback band otherwise looks like a legitimate scene change to the V60 matte guard.\n            val sourceFrameGuardV61 = SequentialSourceFrameGuardV61()\n            val sequentialResult = runCatching {\n                GpuSequentialCutoutDecoderV47(context, PERSON_ANALYSIS_LONG_EDGE_V47).decodeTargets(\n''',
              'source guard declaration',
          )
          analyzer = replace_exact(
              analyzer,
              '''                ) { sourceUs, bitmap ->\n                    // enqueueOwned is synchronous in V58. This prevents MediaCodec/OES GL work for\n                    // the next selected frame from racing the current Paddle OpenCL inference.\n                    worker.enqueueOwned(sourceUs, bitmap)\n                }\n''',
              '''                ) { sourceUs, bitmap ->\n                    // enqueueOwned is synchronous in V58. V61 additionally catches transient wide\n                    // OES/readback bands and re-decodes only that timestamp through the independent\n                    // MediaMetadataRetriever path before GPU neural inference.\n                    val verified = sourceFrameGuardV61.select(bitmap) {\n                        decodeSinglePriorityFrame(clip, sourceUs)\n                    }\n                    worker.enqueueOwned(sourceUs, verified)\n                }\n''',
              'source guard callback',
          )
          analyzer = replace_exact(
              analyzer,
              '''        if (base.width != refined.width || base.height != refined.height) return false\n        if (base.width <= 0 || base.height <= 0) return false\n\n        val stepX = (base.width / 48).coerceAtLeast(1)\n''',
              '''        if (base.width != refined.width || base.height != refined.height) return false\n        if (base.width <= 0 || base.height <= 0) return false\n        // The 48x48 V59 comparison can miss a one/few-pixel horizontal stripe. Reject\n        // catastrophic full-width/full-height band boundaries at native matte resolution first.\n        if (hasWideBandMatteArtifactV61(refined)) return false\n\n        val stepX = (base.width / 48).coerceAtLeast(1)\n''',
              'refined full-resolution guard hook',
          )
          matte_helper = '''\n    private fun hasWideBandMatteArtifactV61(matte: Bitmap): Boolean {\n        val width = matte.width\n        val height = matte.height\n        if (width <= 1 || height <= 1) return false\n        val pixels = IntArray(width * height)\n        matte.getPixels(pixels, 0, width, 0, 0, width, height)\n        val rowCoverage = (width * .58f).roundToInt().coerceAtLeast(1)\n        val columnCoverage = (height * .58f).roundToInt().coerceAtLeast(1)\n\n        for (y in 1 until height) {\n            val previous = (y - 1) * width\n            val current = y * width\n            var severe = 0\n            var deltaSum = 0\n            for (x in 0 until width) {\n                val a = Color.red(pixels[previous + x])\n                val b = Color.red(pixels[current + x])\n                val delta = abs(a - b)\n                deltaSum += delta\n                if (delta >= 128) severe++\n            }\n            if (severe >= rowCoverage && deltaSum.toFloat() / width >= 56f) return true\n        }\n        for (x in 1 until width) {\n            var severe = 0\n            var deltaSum = 0\n            for (y in 0 until height) {\n                val a = Color.red(pixels[y * width + x - 1])\n                val b = Color.red(pixels[y * width + x])\n                val delta = abs(a - b)\n                deltaSum += delta\n                if (delta >= 128) severe++\n            }\n            if (severe >= columnCoverage && deltaSum.toFloat() / height >= 56f) return true\n        }\n        return false\n    }\n'''
          analyzer = replace_exact(
              analyzer,
              '    private fun fuseHairCpu(base: Bitmap, hair: Bitmap?, strength: Float): Bitmap {\n',
              matte_helper + '\n    private fun fuseHairCpu(base: Bitmap, hair: Bitmap?, strength: Float): Bitmap {\n',
              'refined matte helper insertion',
          )

          source_guard = '''\n/**\n * Detects transient wide horizontal/vertical corruption in the MediaCodec/OES analysis Bitmap.\n * A flagged timestamp is re-decoded once through MediaMetadataRetriever; PP-MattingV2 inference\n * remains OpenCL GPU. Only small-band changes are considered suspicious; broad row+column changes\n * are treated as legitimate scene cuts.\n */\nprivate class SequentialSourceFrameGuardV61 {\n    private data class Profile(val rows: FloatArray, val columns: FloatArray)\n\n    private var previous: Profile? = null\n    private var scratch = IntArray(0)\n\n    fun select(candidate: Bitmap, safeDecode: () -> Bitmap?): Bitmap {\n        val candidateProfile = profile(candidate)\n        val old = previous\n        if (old == null || old.rows.size != candidateProfile.rows.size ||\n            old.columns.size != candidateProfile.columns.size\n        ) {\n            previous = candidateProfile\n            return candidate\n        }\n\n        if (!looksLikeTransientBand(old, candidateProfile)) {\n            previous = candidateProfile\n            return candidate\n        }\n\n        val safe = runCatching { safeDecode() }.getOrNull()\n        if (safe != null) {\n            val safeProfile = profile(safe)\n            previous = safeProfile\n            if (!candidate.isRecycled) candidate.recycle()\n            return safe\n        }\n\n        // Keep the last clean profile if the independent decode could not be obtained. That way a\n        // single bad OES frame cannot become the new reference and hide corruption in the next one.\n        return candidate\n    }\n\n    private fun looksLikeTransientBand(previous: Profile, current: Profile): Boolean {\n        var strongRows = 0\n        var strongColumns = 0\n        var maxRowDelta = 0f\n        var maxColumnDelta = 0f\n\n        for (i in current.rows.indices) {\n            val delta = abs(previous.rows[i] - current.rows[i])\n            if (delta >= .22f) strongRows++\n            if (delta > maxRowDelta) maxRowDelta = delta\n        }\n        for (i in current.columns.indices) {\n            val delta = abs(previous.columns[i] - current.columns[i])\n            if (delta >= .22f) strongColumns++\n            if (delta > maxColumnDelta) maxColumnDelta = delta\n        }\n\n        val rowFraction = strongRows / current.rows.size.coerceAtLeast(1).toFloat()\n        val columnFraction = strongColumns / current.columns.size.coerceAtLeast(1).toFloat()\n        if (rowFraction >= .55f && columnFraction >= .55f) return false // real scene cut\n\n        val horizontalBand = maxRowDelta >= .30f && strongRows > 0 && rowFraction <= .42f\n        val verticalBand = maxColumnDelta >= .30f && strongColumns > 0 && columnFraction <= .42f\n        return horizontalBand || verticalBand\n    }\n\n    private fun profile(bitmap: Bitmap): Profile {\n        val width = bitmap.width.coerceAtLeast(1)\n        val height = bitmap.height.coerceAtLeast(1)\n        val required = width * height\n        if (scratch.size < required) scratch = IntArray(required)\n        bitmap.getPixels(scratch, 0, width, 0, 0, width, height)\n\n        val rows = FloatArray(height)\n        val columns = FloatArray(width)\n        val xStep = (width / 48).coerceAtLeast(1)\n        val yStep = (height / 48).coerceAtLeast(1)\n\n        for (y in 0 until height) {\n            var total = 0f\n            var count = 0\n            var x = xStep / 2\n            while (x < width) {\n                total += luma(scratch[y * width + x])\n                count++\n                x += xStep\n            }\n            rows[y] = total / count.coerceAtLeast(1).toFloat()\n        }\n        for (x in 0 until width) {\n            var total = 0f\n            var count = 0\n            var y = yStep / 2\n            while (y < height) {\n                total += luma(scratch[y * width + x])\n                count++\n                y += yStep\n            }\n            columns[x] = total / count.coerceAtLeast(1).toFloat()\n        }\n        return Profile(rows, columns)\n    }\n\n    private fun luma(pixel: Int): Float {\n        val r = ((pixel ushr 16) and 0xff) / 255f\n        val g = ((pixel ushr 8) and 0xff) / 255f\n        val b = (pixel and 0xff) / 255f\n        return .2126f * r + .7152f * g + .0722f * b\n    }\n}\n'''
          analyzer = replace_exact(
              analyzer,
              '\nprivate class GpuPersonCutoutSegmenterV47(context: Context) : AutoCloseable {\n',
              source_guard + '\nprivate class GpuPersonCutoutSegmenterV47(context: Context) : AutoCloseable {\n',
              'source guard class insertion',
          )
          analyzer_path.write_text(analyzer)

          ui_script = Path('scripts/ci_wait_ui.py')
          ui_script.parent.mkdir(parents=True, exist_ok=True)
          ui_script.write_text('''#!/usr/bin/env python3\nimport re\nimport subprocess\nimport sys\nimport time\nimport xml.etree.ElementTree as ET\n\nmode = sys.argv[1]\ntarget_label = sys.argv[2]\ntarget = " ".join(target_label.split()).casefold()\n\ndef norm(value: str | None) -> str:\n    return " ".join((value or "").split()).casefold()\n\nlast_nodes = []\nfor attempt in range(32):\n    subprocess.run(["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)\n    xml = subprocess.check_output(["adb", "shell", "cat", "/sdcard/window.xml"], text=True)\n    root = ET.fromstring(xml)\n    nodes = list(root.iter("node"))\n    last_nodes = nodes\n    node = next((item for item in nodes if target in {norm(item.attrib.get("text")), norm(item.attrib.get("content-desc"))}), None)\n    if node is not None:\n        if mode == "tap":\n            bounds = list(map(int, re.findall(r"\\d+", node.attrib.get("bounds", ""))))\n            if len(bounds) != 4:\n                raise SystemExit(f"Bad bounds for {target_label!r}: {node.attrib}")\n            subprocess.run(["adb", "shell", "input", "tap", str((bounds[0] + bounds[2]) // 2), str((bounds[1] + bounds[3]) // 2)], check=True)\n        print(f"Found UI target {target_label!r} on attempt {attempt + 1}")\n        raise SystemExit(0)\n    time.sleep(0.75)\n\nvisible = sorted({value for item in last_nodes for value in (item.attrib.get("text"), item.attrib.get("content-desc")) if value and value.strip()})\nprint(f"UI target {target_label!r} not found. Visible semantics: {visible}")\nraise SystemExit(1)\n''')

          android_path = Path('.github/workflows/android.yml')
          android = android_path.read_text()
          marker = '            # Compose semantics can appear a little later than Activity startup, and capitalization\n'
          call = '            python3 /tmp/digitor_ui_wait.py tap "New project"\n'
          if marker not in android or call not in android:
              raise SystemExit('missing android.yml CI933 heredoc anchors')
          start = android.index(marker)
          end = android.index(call)
          android = android[:start] + (
              '            # Keep the UI helper in a real repo file: android-emulator-runner executes script\n'
              '            # lines individually, so an inline shell heredoc is not safe here.\n'
          ) + android[end:]
          android = android.replace('python3 /tmp/digitor_ui_wait.py', 'python3 scripts/ci_wait_ui.py')
          android_path.write_text(android)

          Path('.github/workflows/pr57-v61-patch.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Guard decoded and matte bands in Pro Cutout V61'
          git push origin HEAD:perf/ppmattingv2-gpu-128-v57
