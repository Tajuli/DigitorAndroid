name: Finalize Cutout GPU CPU badge

on:
  push:
    branches:
      - perf/ppmattingv2-gpu-128-v57
    paths:
      - .github/workflows/cutout-backend-badge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ppmattingv2-gpu-128-v57
          fetch-depth: 0
      - name: Make backend badge reflect resolved runtime
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/tajuli/digitorandroid/ui/editor/CutoutWorkspaceV50.kt')
          text = path.read_text()
          old = '''                val cpuBackend = analysisStatus?.contains("CPU", ignoreCase = true) == true ||
                    analysisStatus?.contains("ARM", ignoreCase = true) == true
                val gpuBackend = analysisStatus?.contains("OpenCL", ignoreCase = true) == true ||
                    analysisStatus?.contains("GPU", ignoreCase = true) == true
                val badgeText: String
                val badgeColor: Color
                when {
                    analysisFailed -> {
                        badgeText = "CUTOUT: GPU FAILED"
                        badgeColor = C50FailedBadge
                    }
                    cpuBackend -> {
                        badgeText = "CUTOUT: CPU"
                        badgeColor = C50CpuBadge
                    }
                    gpuBackend || personReady -> {
                        badgeText = "CUTOUT: GPU"
                        badgeColor = C50GpuBadge
                    }
                    analysisBusy -> {
                        badgeText = "CUTOUT: CHECKING GPU"
                        badgeColor = C50IdleBadge
                    }
                    else -> {
                        badgeText = "CUTOUT: NOT ANALYZED"
                        badgeColor = C50IdleBadge
                    }
                }
'''
          new = '''                // Only claim GPU after the PP-MattingV2 backend has actually resolved.
                // The initial "starting ... OpenCL pipeline" status is not proof of GPU execution.
                val baseGpuBackend = analysisStatus?.contains(
                    "PP-MattingV2 · Paddle Lite OpenCL GPU",
                    ignoreCase = true,
                ) == true
                val baseCpuBackend = analysisStatus?.contains(
                    "PP-MattingV2 · Paddle Lite ARM CPU",
                    ignoreCase = true,
                ) == true || analysisStatus?.contains(
                    "PP-MattingV2 · CPU",
                    ignoreCase = true,
                ) == true
                val helperCpuFallback = baseGpuBackend &&
                    analysisStatus?.contains("CPU fallback", ignoreCase = true) == true
                val badgeText: String
                val badgeColor: Color
                when {
                    analysisFailed -> {
                        badgeText = "CUTOUT: GPU FAILED"
                        badgeColor = C50FailedBadge
                    }
                    baseCpuBackend -> {
                        badgeText = "CUTOUT: CPU"
                        badgeColor = C50CpuBadge
                    }
                    baseGpuBackend && helperCpuFallback -> {
                        badgeText = "CUTOUT: GPU + CPU"
                        badgeColor = C50CpuBadge
                    }
                    baseGpuBackend || personReady -> {
                        badgeText = "CUTOUT: GPU"
                        badgeColor = C50GpuBadge
                    }
                    analysisBusy -> {
                        badgeText = "CUTOUT: CHECKING GPU"
                        badgeColor = C50IdleBadge
                    }
                    else -> {
                        badgeText = "CUTOUT: NOT ANALYZED"
                        badgeColor = C50IdleBadge
                    }
                }
'''
          if old not in text:
              raise SystemExit('Current Cutout badge block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/cutout-backend-badge.yml
          rm -f .github/workflows/pr57-cutout-backend-badge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Cutout backend badge report resolved runtime'
          git push origin HEAD:perf/ppmattingv2-gpu-128-v57
