name: Add PR57 Cutout backend badge

on:
  push:
    branches:
      - perf/ppmattingv2-gpu-128-v57
    paths:
      - .github/workflows/pr57-cutout-backend-badge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ppmattingv2-gpu-128-v57
          fetch-depth: 0

      - name: Add persistent GPU/CPU badge to Cutout UI
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/tajuli/digitorandroid/ui/editor/CutoutWorkspaceV50.kt')
          lines = path.read_text().splitlines()

          if not any('val backendBadgeV57' in line for line in lines):
              start = next(i for i, line in enumerate(lines) if 'val analysisFailed =' in line)
              end = start
              while end < len(lines) and 'incomplete' not in lines[end]:
                  end += 1
              if end >= len(lines):
                  raise SystemExit('analysisFailed block end not found')
              indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
              block = [
                  f'{indent}val backendBadgeV57 = when {{',
                  f'{indent}    analysisStatus?.contains("CPU", ignoreCase = true) == true ||',
                  f'{indent}        analysisStatus?.contains("ARM", ignoreCase = true) == true -> "CUTOUT: CPU"',
                  f'{indent}    analysisFailed -> "CUTOUT: GPU ERROR"',
                  f'{indent}    analysisStatus?.contains("OpenCL", ignoreCase = true) == true ||',
                  f'{indent}        analysisStatus?.contains("GPU", ignoreCase = true) == true ||',
                  f'{indent}        analysisStatus?.contains("refined frame", ignoreCase = true) == true ||',
                  f'{indent}        personReady -> "CUTOUT: GPU"',
                  f'{indent}    analysisBusy -> "CUTOUT: CHECKING"',
                  f'{indent}    else -> "CUTOUT: NOT RUN"',
                  f'{indent}}}',
              ]
              lines[end + 1:end + 1] = [''] + block

          if not any('"Neural matte backend"' in line for line in lines):
              person = next(i for i, line in enumerate(lines) if 'CutoutModeV43.PERSON -> {' in line)
              indent = lines[person][:len(lines[person]) - len(lines[person].lstrip())] + '    '
              block = [
                  f'{indent}Row(',
                  f'{indent}    Modifier.fillMaxWidth(),',
                  f'{indent}    verticalAlignment = Alignment.CenterVertically,',
                  f'{indent}) {{',
                  f'{indent}    Text(',
                  f'{indent}        "Neural matte backend",',
                  f'{indent}        fontSize = 8.sp,',
                  f'{indent}        color = C50Text.copy(alpha = .62f),',
                  f'{indent}    )',
                  f'{indent}    Spacer(Modifier.weight(1f))',
                  f'{indent}    Box(',
                  f'{indent}        Modifier',
                  f'{indent}            .background(',
                  f'{indent}                Color.White.copy(alpha = if (backendBadgeV57 == "CUTOUT: GPU") .16f else .08f),',
                  f'{indent}                RoundedCornerShape(999.dp),',
                  f'{indent}            )',
                  f'{indent}            .padding(horizontal = 9.dp, vertical = 4.dp),',
                  f'{indent}    ) {{',
                  f'{indent}        Text(backendBadgeV57, fontSize = 8.sp, color = C50Text)',
                  f'{indent}    }}',
                  f'{indent}}}',
                  f'{indent}Text(',
                  f'{indent}    when (backendBadgeV57) {{',
                  f'{indent}        "CUTOUT: GPU" -> "PP-MattingV2 512 inference verified on GPU."',
                  f'{indent}        "CUTOUT: CPU" -> "PP-MattingV2 inference is running on CPU."',
                  f'{indent}        "CUTOUT: CHECKING" -> "Verifying PP-MattingV2 GPU execution…"',
                  f'{indent}        "CUTOUT: GPU ERROR" -> "GPU backend failed; check the analysis message below."',
                  f'{indent}        else -> "Analyze to verify whether PP-MattingV2 runs on GPU."',
                  f'{indent}    }},',
                  f'{indent}    fontSize = 7.sp,',
                  f'{indent}    color = C50Text.copy(alpha = .55f),',
                  f'{indent})',
                  '',
              ]
              lines[person + 1:person + 1] = block

          path.write_text('\n'.join(lines) + '\n')
          PY

          git diff --check
          grep -n "CUTOUT:" app/src/main/java/com/tajuli/digitorandroid/ui/editor/CutoutWorkspaceV50.kt

      - name: Commit UI badge and remove one-time workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/tajuli/digitorandroid/ui/editor/CutoutWorkspaceV50.kt
          git rm .github/workflows/pr57-cutout-backend-badge.yml
          git commit -m 'Show persistent Cutout GPU backend badge'
          git pull --rebase origin perf/ppmattingv2-gpu-128-v57
          git push origin HEAD:perf/ppmattingv2-gpu-128-v57
