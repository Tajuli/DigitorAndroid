name: Apply V59 Cutout artifact guard

on:
  push:
    branches:
      - perf/ppmattingv2-gpu-128-v57
    paths:
      - .github/workflows/pr57-v59-artifact-guard.yml

permissions:
  contents: write

concurrency:
  group: pr57-v59-artifact-guard
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ppmattingv2-gpu-128-v57
          fetch-depth: 0

      - name: Patch artifact guards
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          analyzer = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/GpuPersonCutoutAnalyzerV47.kt')
          s = analyzer.read_text()
          if 'import kotlin.math.abs\n' not in s:
              s = s.replace('import kotlin.math.max\n', 'import kotlin.math.abs\nimport kotlin.math.max\n', 1)

          if 'isRefinedMatteSaneV59' not in s:
              old = '''            result.getOrNull()?.let { return it }\n            runCatching { gpu.close() }\n            gpuTemporal = null\n'''
              new = '''            result.getOrNull()?.let { refined ->\n                if (isRefinedMatteSaneV59(baseMatte, refined)) return refined\n\n                // Some mobile GPU drivers can return a framebuffer with tile/stripe-corrupted\n                // alpha without reporting a GL error. Do not persist it or feed it into temporal\n                // history. Keep the current PP-MattingV2 matte authoritative for this anchor.\n                if (!refined.isRecycled) refined.recycle()\n                runCatching { gpu.close() }\n                gpuTemporal = runCatching { GpuSpatialFlowTemporalMatteStabilizerV47() }.getOrNull()\n                return baseMatte.copy(Bitmap.Config.ARGB_8888, false)\n                    ?: error("Could not preserve clean PP-MattingV2 matte after GPU flow anomaly")\n            }\n            runCatching { gpu.close() }\n            gpuTemporal = null\n'''
              if old not in s:
                  raise SystemExit('GPU stabilizer return anchor missing')
              s = s.replace(old, new, 1)

              anchor = '    private fun fuseHairCpu(base: Bitmap, hair: Bitmap?, strength: Float): Bitmap {\n'
              helper = '''    /** Reject catastrophic stripe/tile alpha changes while allowing normal edge refinement. */\n    private fun isRefinedMatteSaneV59(base: Bitmap, refined: Bitmap): Boolean {\n        if (base.width != refined.width || base.height != refined.height) return false\n        if (base.width <= 0 || base.height <= 0) return false\n\n        val stepX = (base.width / 48).coerceAtLeast(1)\n        val stepY = (base.height / 48).coerceAtLeast(1)\n        var samples = 0\n        var absDelta = 0f\n        var leakedBackground = 0\n        var lostForeground = 0\n        var baseForeground = 0\n        var refinedForeground = 0\n\n        var y = stepY / 2\n        while (y < base.height) {\n            var x = stepX / 2\n            while (x < base.width) {\n                val b = Color.red(base.getPixel(x, y)) / 255f\n                val r = Color.red(refined.getPixel(x, y)) / 255f\n                absDelta += abs(b - r)\n                if (b <= .05f && r >= .35f) leakedBackground++\n                if (b >= .85f && r <= .35f) lostForeground++\n                if (b >= .50f) baseForeground++\n                if (r >= .50f) refinedForeground++\n                samples++\n                x += stepX\n            }\n            y += stepY\n        }\n        if (samples == 0) return false\n\n        val n = samples.toFloat()\n        val meanAbs = absDelta / n\n        val leakRate = leakedBackground / n\n        val lossRate = lostForeground / n\n        val baseFgRate = baseForeground / n\n        val refinedFgRate = refinedForeground / n\n        return meanAbs <= .13f &&\n            leakRate <= .035f &&\n            lossRate <= .06f &&\n            refinedFgRate <= baseFgRate * 1.35f + .07f\n    }\n\n'''
              if anchor not in s:
                  raise SystemExit('fuseHairCpu anchor missing')
              s = s.replace(anchor, helper + anchor, 1)
          analyzer.write_text(s)

          effect = Path('app/src/main/java/com/tajuli/digitorandroid/editor/render/CutoutEffectV43.kt')
          s = effect.read_text()
          if 'import com.tajuli.digitorandroid.editor.processing.hasPersonCutoutCoverageV43\n' not in s:
              anchor = 'import com.tajuli.digitorandroid.editor.processing.PersonCutoutMaskStoreV43\n'
              if anchor not in s:
                  raise SystemExit('CutoutEffect import anchor missing')
              s = s.replace(anchor, anchor + 'import com.tajuli.digitorandroid.editor.processing.hasPersonCutoutCoverageV43\n', 1)

          if 'finish Analyze before export' not in s:
              old = '''        private fun personBracket(clip: TimelineClip, sourceUs: Long): MaskBracket {\n            val frames = PersonCutoutMaskStoreV43.index(appContext, clip).frames\n'''
              new = '''        private fun personBracket(clip: TimelineClip, sourceUs: Long): MaskBracket {\n            // Do not interpolate sparse masks while Analyze is still writing the generation.\n            // Preview stays visually stable on the original frame; export must wait for completion.\n            if (!hasPersonCutoutCoverageV43(appContext, clip)) {\n                if (!preview) {\n                    throw VideoFrameProcessingException(\n                        IllegalStateException("Pro Cutout analysis is incomplete; finish Analyze before export"),\n                    )\n                }\n                return MaskBracket.empty()\n            }\n            val frames = PersonCutoutMaskStoreV43.index(appContext, clip).frames\n'''
              if old not in s:
                  raise SystemExit('personBracket anchor missing')
              s = s.replace(old, new, 1)
          effect.write_text(s)

          generation = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/PersonCutoutGenerationV47.kt')
          s = generation.read_text()
          s, count = re.subn(
              r'private const val V47_GENERATION_VERSION = "[^"]+"',
              'private const val V47_GENERATION_VERSION = "adaptive-v59-ppmattingv2-opencl-fp32-safe-flow-artifact-guard-r1"',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit('generation version anchor missing')
          generation.write_text(s)
          PY

          git diff --check

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/pr57-v59-artifact-guard.yml
          git add -A
          git commit -m 'Guard Pro Cutout against corrupted and partial mattes'
          git pull --rebase origin perf/ppmattingv2-gpu-128-v57
          git push origin HEAD:perf/ppmattingv2-gpu-128-v57
