name: Clean PR57 GPU-only packaging

on:
  push:
    branches:
      - perf/ppmattingv2-gpu-128-v57
    paths:
      - .github/workflows/ppmatting-pr57-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ppmattingv2-gpu-128-v57
          fetch-depth: 0

      - name: Remove unused ARM fallback model from build packaging
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/build.gradle.kts')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '''// V56 keeps the exact PP-MattingV2/STDC1 512 network that produced CI804 quality, but converts the\n// official Paddle inference model into two explicit Paddle Lite programs. The OpenCL program has no\n// ARM kernels, so a successful predictor/run is guaranteed to be GPU-backed rather than a silent\n// mixed CPU graph. The separate ARM program is the same network and is used only as the fallback.\n// Large third-party artifacts remain build-generated instead of entering git history.\n''',
              '''// V57 keeps the exact PP-MattingV2/STDC1 512 network that produced CI804 quality and converts the\n// official Paddle inference model into one OpenCL-only Paddle Lite program. The generated model has\n// no ARM kernels, so a successful predictor/run is GPU-backed rather than a silent mixed CPU graph.\n// Large third-party artifacts remain build-generated instead of entering git history.\n''',
          )

          replace_once(
              '''val ppMattingV2OpenClModelV56 = generatedPpMattingV2Assets.map {\n    it.file("ppmattingv2_stdc1_human_512_opencl.nb")\n}\nval ppMattingV2ArmModelV56 = generatedPpMattingV2Assets.map {\n    it.file("ppmattingv2_stdc1_human_512_arm.nb")\n}\n\nval generatePpMattingV2PaddleLiteModelsV56 by tasks.registering {\n    outputs.files(ppMattingV2OpenClModelV56, ppMattingV2ArmModelV56)\n''',
              '''val ppMattingV2OpenClModelV56 = generatedPpMattingV2Assets.map {\n    it.file("ppmattingv2_stdc1_human_512_opencl.nb")\n}\n\nval generatePpMattingV2PaddleLiteModelsV56 by tasks.registering {\n    outputs.file(ppMattingV2OpenClModelV56)\n''',
          )

          replace_once(
              '''        // GPU and CPU stay as separate programs. The OpenCL model cannot silently execute ARM ops.\n        optimize("opencl", ppMattingV2OpenClModelV56.get().asFile, enableFp16 = true)\n        optimize("arm", ppMattingV2ArmModelV56.get().asFile, enableFp16 = false)\n''',
              '''        // GPU-only program: no ARM target is generated or packaged in PR #57.\n        optimize("opencl", ppMattingV2OpenClModelV56.get().asFile, enableFp16 = true)\n''',
          )

          path.write_text(text)
          PY

          grep -n "ppmattingv2_stdc1_human_512_arm\|optimize(\"arm\"" app/build.gradle.kts && exit 1 || true
          git diff --check

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          rm .github/workflows/ppmatting-pr57-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts .github/workflows/ppmatting-pr57-cleanup.yml
          git commit -m 'Package only PP-MattingV2 OpenCL model in PR57'
          git pull --rebase origin perf/ppmattingv2-gpu-128-v57
          git push origin HEAD:perf/ppmattingv2-gpu-128-v57
