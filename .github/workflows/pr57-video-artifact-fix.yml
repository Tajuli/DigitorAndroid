name: Fix PR57 video matte artifacts

on:
  push:
    branches:
      - perf/ppmattingv2-gpu-128-v57
    paths:
      - .github/workflows/pr57-video-artifact-fix.yml

permissions:
  contents: write

concurrency:
  group: pr57-video-artifact-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ppmattingv2-gpu-128-v57
          fetch-depth: 0

      - name: Guard temporal matte and partial generations
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected patch anchor not found in {path}')
              if s.count(old) != 1:
                  raise SystemExit(f'Patch anchor is not unique in {path}: {s.count(old)}')
              p.write_text(s.replace(old, new, 1))

          analyzer = 'app/src/main/java/com/tajuli/digitorandroid/editor/processing/GpuPersonCutoutAnalyzerV47.kt'
          replace_once(
              analyzer,
              'import kotlin.math.max\nimport kotlin.math.roundToInt',
              'import kotlin.math.abs\nimport kotlin.math.max\nimport kotlin.math.roundToInt',
          )
          replace_once(
              analyzer,
              '''            result.getOrNull()?.let { return it }\n            runCatching { gpu.close() }\n            gpuTemporal = null\n''',
              '''            result.getOrNull()?.let { refined ->\n                if (isRefinedMatteSaneV57(baseMatte, refined)) return refined\n\n                // A vendor GL/OpenCL path can occasionally return a tile/stripe-corrupted alpha\n                // frame without raising a GL error. Never persist that frame or feed it into the\n                // next temporal step. PP-MattingV2 is authoritative, so use its current-frame matte\n                // for this anchor and recreate the GPU temporal history from a clean state.\n                if (!refined.isRecycled) refined.recycle()\n                runCatching { gpu.close() }\n                gpuTemporal = runCatching { GpuSpatialFlowTemporalMatteStabilizerV47() }.getOrNull()\n                return baseMatte.copy(Bitmap.Config.ARGB_8888, false)\n                    ?: error("Could not preserve clean PP-MattingV2 matte after GPU flow anomaly")\n            }\n            runCatching { gpu.close() }\n            gpuTemporal = null\n''',
          )
          replace_once(
              analyzer,
              '''    private fun fuseHairCpu(base: Bitmap, hair: Bitmap?, strength: Float): Bitmap {\n''',
              '''    /**\n     * Reject catastrophic temporal/hair refinements while leaving normal edge stabilization alone.\n     * The check samples a small grid, so it is cheap compared with a 512x512 model inference.\n     * Broad foreground birth, foreground loss, or large alpha divergence are signatures of the\n     * rectangular/horizontal corruption seen in the target-phone reproduction.\n     */\n    private fun isRefinedMatteSaneV57(base: Bitmap, refined: Bitmap): Boolean {\n        if (base.width != refined.width || base.height != refined.height) return false\n        if (base.width <= 0 || base.height <= 0) return false\n\n        val stepX = (base.width / 48).coerceAtLeast(1)\n        val stepY = (base.height / 48).coerceAtLeast(1)\n        var samples = 0\n        var absDelta = 0f\n        var leakedBackground = 0\n        var lostForeground = 0\n        var baseForeground = 0\n        var refinedForeground = 0\n\n        var y = stepY / 2\n        while (y < base.height) {\n            var x = stepX / 2\n            while (x < base.width) {\n                val b = Color.red(base.getPixel(x, y)) / 255f\n                val r = Color.red(refined.getPixel(x, y)) / 255f\n                absDelta += abs(b - r)\n                if (b <= .05f && r >= .35f) leakedBackground++\n                if (b >= .85f && r <= .35f) lostForeground++\n                if (b >= .50f) baseForeground++\n                if (r >= .50f) refinedForeground++\n                samples++\n                x += stepX\n            }\n            y += stepY\n        }\n        if (samples <= 0) return false\n\n        val n = samples.toFloat()\n        val meanAbs = absDelta / n\n        val leakRate = leakedBackground / n\n        val lossRate = lostForeground / n\n        val baseFgRate = baseForeground / n\n        val refinedFgRate = refinedForeground / n\n\n        return meanAbs <= .13f &&\n            leakRate <= .035f &&\n            lossRate <= .06f &&\n            refinedFgRate <= baseFgRate * 1.35f + .07f\n    }\n\n    private fun fuseHairCpu(base: Bitmap, hair: Bitmap?, strength: Float): Bitmap {\n''',
          )

          effect = 'app/src/main/java/com/tajuli/digitorandroid/editor/render/CutoutEffectV43.kt'
          replace_once(
              effect,
              'import com.tajuli.digitorandroid.editor.processing.PersonCutoutMaskStoreV43\n',
              'import com.tajuli.digitorandroid.editor.processing.PersonCutoutMaskStoreV43\nimport com.tajuli.digitorandroid.editor.processing.hasPersonCutoutCoverageV43\n',
          )
          replace_once(
              effect,
              '''        private fun personBracket(clip: TimelineClip, sourceUs: Long): MaskBracket {\n            val frames = PersonCutoutMaskStoreV43.index(appContext, clip).frames\n''',
              '''        private fun personBracket(clip: TimelineClip, sourceUs: Long): MaskBracket {\n            // Never interpolate a partially written analysis generation. While Analyze is running,\n            // preview shows the uncut original instead of stretching sparse/partial masks over the\n            // rest of the clip. Export fails explicitly until the generation is complete.\n            if (!hasPersonCutoutCoverageV43(appContext, clip)) {\n                if (!preview) {\n                    throw VideoFrameProcessingException(\n                        IllegalStateException("Pro Cutout analysis is incomplete; finish Analyze before export"),\n                    )\n                }\n                return MaskBracket.empty()\n            }\n            val frames = PersonCutoutMaskStoreV43.index(appContext, clip).frames\n''',
          )

          generation = 'app/src/main/java/com/tajuli/digitorandroid/editor/processing/PersonCutoutGenerationV47.kt'
          replace_once(
              generation,
              'adaptive-v57-ppmattingv2-paddle-opencl-gpu-only-fp32-r2',
              'adaptive-v57-ppmattingv2-paddle-opencl-gpu-only-fp32-r3-artifact-guard',
          )
          PY

          git diff --check
          git diff -- app/src/main/java/com/tajuli/digitorandroid/editor/processing/GpuPersonCutoutAnalyzerV47.kt \
            app/src/main/java/com/tajuli/digitorandroid/editor/render/CutoutEffectV43.kt \
            app/src/main/java/com/tajuli/digitorandroid/editor/processing/PersonCutoutGenerationV47.kt

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/pr57-video-artifact-fix.yml
          git add -A
          git commit -m 'Guard PP-MattingV2 video matte artifacts'
          git pull --rebase origin perf/ppmattingv2-gpu-128-v57
          git push origin HEAD:perf/ppmattingv2-gpu-128-v57
