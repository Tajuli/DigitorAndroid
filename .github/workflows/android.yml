name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Compile instrumentation parity test
        run: gradle :app:assembleDebugAndroidTest
      - name: Build shrunk arm64 phone APK
        run: gradle :app:assemblePhone -PdigitorAbi=arm64-v8a
      - name: Report phone APK size
        run: |
          ls -lh app/build/outputs/apk/phone/app-phone.apk
          du -h app/build/outputs/apk/phone/app-phone.apk
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitorAndroid-phone-apk
          path: app/build/outputs/apk/phone/app-phone.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify optimized release build
        run: gradle :app:assembleRelease -PdigitorAbi=arm64-v8a

  pixel-parity:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run render parity, semantic beauty, and shrunk-phone smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle :app:connectedDebugAndroidTest -PdigitorAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.tajuli.digitorandroid.editor.render.PreviewExportPixelParityInstrumentedTest,com.tajuli.digitorandroid.editor.render.PureTextExportInstrumentedTest,com.tajuli.digitorandroid.editor.render.NativeImageExportInstrumentedTest,com.tajuli.digitorandroid.editor.render.TransitionExportInstrumentedTest,com.tajuli.digitorandroid.editor.render.BeautyFilterExportInstrumentedTest,com.tajuli.digitorandroid.editor.processing.HairSegmentationInstrumentedTest,com.tajuli.digitorandroid.editor.processing.FaceSkinSegmentationInstrumentedTest
            gradle :app:assemblePhone -PdigitorAbi=x86_64
            adb install -r app/build/outputs/apk/phone/app-phone.apk
            adb shell am force-stop com.tajuli.digitorandroid
            adb shell monkey -p com.tajuli.digitorandroid -c android.intent.category.LAUNCHER 1
            sleep 5
            PID="$(adb shell pidof com.tajuli.digitorandroid | tr -d '\r')"
            test -n "$PID"
