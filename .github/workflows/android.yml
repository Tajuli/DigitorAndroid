name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export fixed PP-MattingV2 256, 320 and 384 graphs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy==1.26.4' \
            'paddlepaddle==2.6.2' \
            'paddle2onnx==1.3.1' \
            'onnx==1.16.2'

          PADDLESEG_DIR="$RUNNER_TEMP/PaddleSeg"
          git clone --depth 1 --branch release/2.10 https://github.com/PaddlePaddle/PaddleSeg.git "$PADDLESEG_DIR"
          python -m pip install -e "$PADDLESEG_DIR"
          python -m pip install -r "$PADDLESEG_DIR/Matting/requirements.txt"

          mkdir -p "$PADDLESEG_DIR/Matting/pretrained_models"
          OFFICIAL_512="$PADDLESEG_DIR/Matting/pretrained_models/ppmattingv2-stdc1-human_512.pdparams"
          curl -L --fail --retry 4 --retry-delay 2 \
            -o "$OFFICIAL_512" \
            https://paddleseg.bj.bcebos.com/matting/models/ppmattingv2-stdc1-human_512.pdparams
          test "$(stat -c%s "$OFFICIAL_512")" -gt 5000000
          echo "Stable official human checkpoint: $(sha256sum "$OFFICIAL_512" | cut -d' ' -f1)"

          TRUE256="$GITHUB_WORKSPACE/app/build/generated/ppMattingV2True256/ppmattingv2_stdc1_human_256.onnx"
          TRUE320="$GITHUB_WORKSPACE/app/build/generated/ppMattingV2True320/ppmattingv2_stdc1_human_320.onnx"
          TRUE384="$GITHUB_WORKSPACE/app/build/generated/ppMattingV2True384/ppmattingv2_stdc1_human_384.onnx"

          PADDLESEG_DIR="$PADDLESEG_DIR" \
          PPMATTING_CONFIG="$GITHUB_WORKSPACE/tools/ppmattingv2/ppmattingv2-stdc1-human_256-finetune.yml" \
          PPMATTING_CHECKPOINT="$OFFICIAL_512" \
          OUTPUT_ONNX="$TRUE256" \
            bash "$GITHUB_WORKSPACE/tools/ppmattingv2/export_true_256.sh"

          PADDLESEG_DIR="$PADDLESEG_DIR" \
          PPMATTING_CONFIG="$GITHUB_WORKSPACE/tools/ppmattingv2/ppmattingv2-stdc1-human_320-finetune.yml" \
          PPMATTING_CHECKPOINT="$OFFICIAL_512" \
          OUTPUT_ONNX="$TRUE320" \
            bash "$GITHUB_WORKSPACE/tools/ppmattingv2/export_true_320.sh"

          PADDLESEG_DIR="$PADDLESEG_DIR" \
          PPMATTING_CONFIG="$GITHUB_WORKSPACE/tools/ppmattingv2/ppmattingv2-stdc1-human_384-finetune.yml" \
          PPMATTING_CHECKPOINT="$OFFICIAL_512" \
          OUTPUT_ONNX="$TRUE384" \
            bash "$GITHUB_WORKSPACE/tools/ppmattingv2/export_true_384.sh"

          python - "$TRUE256" 256 "$TRUE320" 320 "$TRUE384" 384 <<'PY'
          import os, sys, onnx
          pairs = list(zip(sys.argv[1::2], map(int, sys.argv[2::2])))
          for path, size in pairs:
              model = onnx.load(path)
              onnx.checker.check_model(model)
              dims = [d.dim_value for d in model.graph.input[0].type.tensor_type.shape.dim]
              expected = [1, 3, size, size]
              assert dims == expected, (path, dims, expected)
              print(f"Fixed {size} ONNX ready: {os.path.getsize(path) / 1024 / 1024:.1f} MiB, input={dims}")
          PY

      - name: Upload fixed PP-MattingV2 ONNX graphs
        uses: actions/upload-artifact@v4
        with:
          name: Digitor-PPMattingV2-fixed-onnx
          path: |
            app/build/generated/ppMattingV2True256/ppmattingv2_stdc1_human_256.onnx
            app/build/generated/ppMattingV2True320/ppmattingv2_stdc1_human_320.onnx
            app/build/generated/ppMattingV2True384/ppmattingv2_stdc1_human_384.onnx
          if-no-files-found: error
          retention-days: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Compile instrumentation parity test
        run: gradle :app:assembleDebugAndroidTest
      - name: Build arm64 phone APK
        run: gradle :app:assemblePhone -PdigitorAbi=arm64-v8a
      - name: Report phone APK size
        run: |
          ls -lh app/build/outputs/apk/phone/app-phone.apk
          du -h app/build/outputs/apk/phone/app-phone.apk
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitorAndroid-phone-apk
          path: app/build/outputs/apk/phone/app-phone.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify optimized release build
        run: gradle :app:assembleRelease -PdigitorAbi=arm64-v8a

  pixel-parity:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed PP-MattingV2 ONNX graphs
        uses: actions/download-artifact@v4
        with:
          name: Digitor-PPMattingV2-fixed-onnx
          path: app/build/generated
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run render parity, semantic beauty, and phone UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle :app:connectedDebugAndroidTest -PdigitorAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.tajuli.digitorandroid.editor.render.PreviewExportPixelParityInstrumentedTest,com.tajuli.digitorandroid.editor.render.PureTextExportInstrumentedTest,com.tajuli.digitorandroid.editor.render.NativeImageExportInstrumentedTest,com.tajuli.digitorandroid.editor.render.TransitionExportInstrumentedTest,com.tajuli.digitorandroid.editor.render.BeautyFilterExportInstrumentedTest,com.tajuli.digitorandroid.editor.processing.HairSegmentationInstrumentedTest,com.tajuli.digitorandroid.editor.processing.FaceSkinSegmentationInstrumentedTest
            gradle :app:assemblePhone -PdigitorAbi=x86_64
            adb install -r app/build/outputs/apk/phone/app-phone.apk
            adb shell pm clear com.tajuli.digitorandroid
            adb logcat -c
            adb shell am start -W -n com.tajuli.digitorandroid/.MainActivity
            sleep 3
            PID="$(adb shell pidof com.tajuli.digitorandroid | tr -d '\r')"; if [ -z "$PID" ]; then echo '=== Digitor startup failed ==='; adb logcat -d -v threadtime | grep -E -A 80 -B 20 'FATAL EXCEPTION|AndroidRuntime|com.tajuli.digitorandroid' | tail -400 || true; exit 1; fi
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; subprocess.run(["adb","shell","uiautomator","dump","/sdcard/window.xml"],check=True,stdout=subprocess.DEVNULL); root=ET.fromstring(subprocess.check_output(["adb","shell","cat","/sdcard/window.xml"],text=True)); n=next(e for e in root.iter("node") if e.attrib.get("text")=="New project"); b=list(map(int,re.findall(r"\d+",n.attrib["bounds"]))); subprocess.run(["adb","shell","input","tap",str((b[0]+b[2])//2),str((b[1]+b[3])//2)],check=True)'
            sleep 2
            PID="$(adb shell pidof com.tajuli.digitorandroid | tr -d '\r')"; if [ -z "$PID" ]; then echo '=== New Project button crashed Digitor ==='; adb logcat -d -v threadtime | grep -E -A 100 -B 30 'FATAL EXCEPTION|AndroidRuntime|com.tajuli.digitorandroid' | tail -500 || true; exit 1; fi
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; subprocess.run(["adb","shell","uiautomator","dump","/sdcard/window.xml"],check=True,stdout=subprocess.DEVNULL); root=ET.fromstring(subprocess.check_output(["adb","shell","cat","/sdcard/window.xml"],text=True)); n=next(e for e in root.iter("node") if e.attrib.get("text")=="16:9"); b=list(map(int,re.findall(r"\d+",n.attrib["bounds"]))); subprocess.run(["adb","shell","input","tap",str((b[0]+b[2])//2),str((b[1]+b[3])//2)],check=True)'
            sleep 5
            PID="$(adb shell pidof com.tajuli.digitorandroid | tr -d '\r')"; if [ -z "$PID" ]; then echo '=== 16:9 project creation crashed Digitor ==='; adb logcat -d -v threadtime | grep -E -A 120 -B 40 'FATAL EXCEPTION|AndroidRuntime|com.tajuli.digitorandroid' | tail -600 || true; exit 1; fi
            python3 -c 'import subprocess,xml.etree.ElementTree as ET; subprocess.run(["adb","shell","uiautomator","dump","/sdcard/window.xml"],check=True,stdout=subprocess.DEVNULL); root=ET.fromstring(subprocess.check_output(["adb","shell","cat","/sdcard/window.xml"],text=True)); assert any(e.attrib.get("text")=="Export" for e in root.iter("node")), "Editor did not open after New Project -> 16:9"'
            echo "Phone New Project flow passed"
