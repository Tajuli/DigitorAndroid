name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest
      - name: Compile instrumentation parity test
        run: gradle :app:assembleDebugAndroidTest
      - name: Build arm64 phone APK
        run: gradle :app:assemblePhone -PdigitorAbi=arm64-v8a
      - name: Report phone APK size
        run: |
          ls -lh app/build/outputs/apk/phone/app-phone.apk
          du -h app/build/outputs/apk/phone/app-phone.apk
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: DigitorAndroid-phone-apk
          path: app/build/outputs/apk/phone/app-phone.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify optimized release build
        run: gradle :app:assembleRelease -PdigitorAbi=arm64-v8a

  pixel-parity:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run render parity, semantic beauty, and phone UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle :app:connectedDebugAndroidTest -PdigitorAbi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.tajuli.digitorandroid.editor.render.PreviewExportPixelParityInstrumentedTest,com.tajuli.digitorandroid.editor.render.PureTextExportInstrumentedTest,com.tajuli.digitorandroid.editor.render.NativeImageExportInstrumentedTest,com.tajuli.digitorandroid.editor.render.TransitionExportInstrumentedTest,com.tajuli.digitorandroid.editor.render.BeautyFilterExportInstrumentedTest,com.tajuli.digitorandroid.editor.processing.HairSegmentationInstrumentedTest,com.tajuli.digitorandroid.editor.processing.FaceSkinSegmentationInstrumentedTest
            gradle :app:assemblePhone -PdigitorAbi=x86_64
            adb install -r app/build/outputs/apk/phone/app-phone.apk
            adb shell pm clear com.tajuli.digitorandroid
            adb logcat -c
            adb shell am start -W -n com.tajuli.digitorandroid/.MainActivity
            PID="$(adb shell pidof com.tajuli.digitorandroid | tr -d '\r')"; if [ -z "$PID" ]; then echo '=== Digitor startup failed ==='; adb logcat -d -v threadtime | grep -E -A 80 -B 20 'FATAL EXCEPTION|AndroidRuntime|com.tajuli.digitorandroid' | tail -400 || true; exit 1; fi

            # Compose semantics can appear a little later than Activity startup, and capitalization
            # changed from "New project" to "New Project" in one revision. Wait for text/content-desc
            # case-insensitively instead of failing the whole CI on a one-shot exact string lookup.
            cat > /tmp/digitor_ui_wait.py <<'PY'
            import re
            import subprocess
            import sys
            import time
            import xml.etree.ElementTree as ET

            mode = sys.argv[1]
            target = " ".join(sys.argv[2].split()).casefold()

            def norm(value):
                return " ".join((value or "").split()).casefold()

            last_nodes = []
            for attempt in range(24):
                subprocess.run(
                    ["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"],
                    check=True,
                    stdout=subprocess.DEVNULL,
                    stderr=subprocess.DEVNULL,
                )
                xml = subprocess.check_output(
                    ["adb", "shell", "cat", "/sdcard/window.xml"], text=True
                )
                root = ET.fromstring(xml)
                nodes = list(root.iter("node"))
                last_nodes = nodes
                node = next(
                    (
                        item
                        for item in nodes
                        if target in {
                            norm(item.attrib.get("text")),
                            norm(item.attrib.get("content-desc")),
                        }
                    ),
                    None,
                )
                if node is not None:
                    if mode == "tap":
                        bounds = list(map(int, re.findall(r"\d+", node.attrib.get("bounds", ""))))
                        if len(bounds) != 4:
                            raise SystemExit(f"Bad bounds for {sys.argv[2]!r}: {node.attrib}")
                        subprocess.run(
                            [
                                "adb",
                                "shell",
                                "input",
                                "tap",
                                str((bounds[0] + bounds[2]) // 2),
                                str((bounds[1] + bounds[3]) // 2),
                            ],
                            check=True,
                        )
                    print(f"Found UI target {sys.argv[2]!r} on attempt {attempt + 1}")
                    raise SystemExit(0)
                time.sleep(0.75)

            visible = sorted(
                {
                    value
                    for item in last_nodes
                    for value in (item.attrib.get("text"), item.attrib.get("content-desc"))
                    if value and value.strip()
                }
            )
            print(f"UI target {sys.argv[2]!r} not found. Visible semantics: {visible}")
            raise SystemExit(1)
            PY

            python3 /tmp/digitor_ui_wait.py tap "New project"
            sleep 1
            PID="$(adb shell pidof com.tajuli.digitorandroid | tr -d '\r')"; if [ -z "$PID" ]; then echo '=== New Project button crashed Digitor ==='; adb logcat -d -v threadtime | grep -E -A 100 -B 30 'FATAL EXCEPTION|AndroidRuntime|com.tajuli.digitorandroid' | tail -500 || true; exit 1; fi
            python3 /tmp/digitor_ui_wait.py tap "16:9"
            sleep 2
            PID="$(adb shell pidof com.tajuli.digitorandroid | tr -d '\r')"; if [ -z "$PID" ]; then echo '=== 16:9 project creation crashed Digitor ==='; adb logcat -d -v threadtime | grep -E -A 120 -B 40 'FATAL EXCEPTION|AndroidRuntime|com.tajuli.digitorandroid' | tail -600 || true; exit 1; fi
            python3 /tmp/digitor_ui_wait.py wait "Export"
            echo "Phone New Project flow passed"
