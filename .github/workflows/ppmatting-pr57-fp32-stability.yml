name: Stabilize PP-MattingV2 OpenCL output

on:
  push:
    branches:
      - perf/ppmattingv2-gpu-128-v57
    paths:
      - .github/workflows/ppmatting-pr57-fp32-stability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ppmattingv2-gpu-128-v57
          fetch-depth: 0

      - name: Switch PP-MattingV2 OpenCL model to FP32 and invalidate old mattes
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          s = build.read_text()
          old = 'optimize("opencl", ppMattingV2OpenClModelV56.get().asFile, enableFp16 = true)'
          new = 'optimize("opencl", ppMattingV2OpenClModelV56.get().asFile, enableFp16 = false)'
          if old not in s:
              raise SystemExit('OpenCL FP16 optimizer call not found')
          build.write_text(s.replace(old, new, 1))

          backend = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/PortraitMatteBackendV50.kt')
          s = backend.read_text()
          old = 'PP-MattingV2 · Paddle Lite OpenCL GPU · FP16 · 512'
          new = 'PP-MattingV2 · Paddle Lite OpenCL GPU · FP32 · 512'
          if old not in s:
              raise SystemExit('FP16 backend label not found')
          backend.write_text(s.replace(old, new))

          generation = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/PersonCutoutGenerationV47.kt')
          s = generation.read_text()
          old = 'adaptive-v57-ppmattingv2-paddle-opencl-gpu-only-r1'
          new = 'adaptive-v57-ppmattingv2-paddle-opencl-gpu-only-fp32-r2'
          if old not in s:
              raise SystemExit('generation signature not found')
          generation.write_text(s.replace(old, new, 1))

          analyzer = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/GpuPersonCutoutAnalyzerV47.kt')
          s = analyzer.read_text()
          s = s.replace(
              'same network\'s ARM model as fallback. MediaPipe HairSegmenter and the existing GPU-first local',
              'an OpenCL FP32 program. MediaPipe HairSegmenter and the existing GPU-first local',
          )
          analyzer.write_text(s)
          PY

          git rm .github/workflows/ppmatting-pr57-fp32-stability.yml
          git add app/build.gradle.kts \
            app/src/main/java/com/tajuli/digitorandroid/editor/processing/PortraitMatteBackendV50.kt \
            app/src/main/java/com/tajuli/digitorandroid/editor/processing/PersonCutoutGenerationV47.kt \
            app/src/main/java/com/tajuli/digitorandroid/editor/processing/GpuPersonCutoutAnalyzerV47.kt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use PP-MattingV2 OpenCL FP32 for stable target-phone mattes'
          git pull --rebase origin perf/ppmattingv2-gpu-128-v57
          git push origin HEAD:perf/ppmattingv2-gpu-128-v57
