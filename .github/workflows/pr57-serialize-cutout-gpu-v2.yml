name: Serialize PR57 Cutout GPU pipeline v2

on:
  push:
    branches:
      - perf/ppmattingv2-gpu-128-v57
    paths:
      - .github/workflows/pr57-serialize-cutout-gpu-v2.yml

permissions:
  contents: write

concurrency:
  group: pr57-serialize-cutout-gpu-v2
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ppmattingv2-gpu-128-v57
          fetch-depth: 0

      - name: Serialize decoder GL and Paddle OpenCL per selected frame
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          analyzer = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/GpuPersonCutoutAnalyzerV47.kt')
          s = analyzer.read_text()

          # Priority frame: finish inference before the sequential decoder starts using GL.
          old = '''                decodeSinglePriorityFrame(clip, priority)?.let { frame ->
                    worker.enqueueOwned(priority, frame)
                }
'''
          new = '''                decodeSinglePriorityFrame(clip, priority)?.let { frame ->
                    worker.enqueueOwned(priority, frame)
                    // UniSOC/Mali: do not overlap decoder/GL work with Paddle OpenCL inference.
                    worker.awaitIdle()
                }
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'worker.enqueueOwned(priority, frame)\n                    worker.awaitIdle()' not in s:
              raise SystemExit('priority enqueue block not found')

          # MediaCodec/OES selected frames: strict one-frame barrier.
          old = '''                ) { sourceUs, bitmap ->
                    worker.enqueueOwned(sourceUs, bitmap)
                }
'''
          new = '''                ) { sourceUs, bitmap ->
                    worker.enqueueOwned(sourceUs, bitmap)
                    // Some mobile drivers corrupt OES/readback when decoder GL and Paddle OpenCL
                    // execute concurrently. Finish this matte before the decoder touches GL again.
                    worker.awaitIdle()
                }
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'worker.enqueueOwned(sourceUs, bitmap)\n                    worker.awaitIdle()' not in s:
              raise SystemExit('sequential enqueue block not found')

          # MediaMetadataRetriever fallback follows the same GPU serialization rule.
          old = '''                        val frame = scaledFrameAtTime(retriever, sourceUs) ?: continue
                        worker.enqueueOwned(sourceUs, frame)
'''
          new = '''                        val frame = scaledFrameAtTime(retriever, sourceUs) ?: continue
                        worker.enqueueOwned(sourceUs, frame)
                        worker.awaitIdle()
'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'worker.enqueueOwned(sourceUs, frame)\n                        worker.awaitIdle()' not in s:
              raise SystemExit('retriever enqueue block not found')

          s = s.replace('append(" · direct frame queue")', 'append(" · serialized frame queue")')
          analyzer.write_text(s)

          generation = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/PersonCutoutGenerationV47.kt')
          g = generation.read_text()
          g2, count = re.subn(
              r'private const val V47_GENERATION_VERSION = "[^"]+"',
              'private const val V47_GENERATION_VERSION = "adaptive-v59-ppmattingv2-opencl-fp32-safe-flow-serialized-r5"',
              g,
              count=1,
          )
          if count != 1:
              raise SystemExit('generation version not found')
          generation.write_text(g2)

          Path('.github/workflows/pr57-serialize-cutout-gpu-v2.yml').unlink()
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Serialize Cutout decoder and OpenCL inference on target GPU'
          git pull --rebase origin perf/ppmattingv2-gpu-128-v57
          git push origin HEAD:perf/ppmattingv2-gpu-128-v57