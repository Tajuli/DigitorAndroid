name: Serialize PR57 Cutout GPU decode/inference

on:
  push:
    branches:
      - perf/ppmattingv2-gpu-128-v57
    paths:
      - .github/workflows/pr57-serialize-cutout-gpu.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/ppmattingv2-gpu-128-v57
          fetch-depth: 0

      - name: Patch Cutout decode/inference serialization
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          analyzer = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/GpuPersonCutoutAnalyzerV47.kt')
          s = analyzer.read_text()

          old = ''' * LOW: 4 fps. MEDIUM: 12 fps. HIGH: every decoded frame. Hardware decode overlaps a bounded
 * inference worker and decoded frame ownership moves straight into that queue with no second ARGB
 * copy. PP-MattingV2/STDC1 512 supplies the base soft alpha through an OpenCL-only model, with the
 * an OpenCL FP32 program. MediaPipe HairSegmenter and the existing GPU-first local
 * spatial-flow stabilizer then refine the matte before shared preview/export persistence.
'''
          new = ''' * LOW: 4 fps. MEDIUM: 12 fps. HIGH: every decoded frame. Selected MediaCodec/OES readback and
 * PP-MattingV2 OpenCL inference are intentionally serialized on target phones: overlapping the
 * decoder GL producer with Paddle OpenCL caused intermittent block-corrupted analysis frames on the
 * UniSOC/Mali path, which then became striped/rectangular alpha leaks in preview/export. Bitmap
 * ownership still transfers directly with no second full-frame ARGB copy. PP-MattingV2/STDC1 512
 * supplies the base soft alpha through the OpenCL-only program; MediaPipe HairSegmenter and the
 * GPU-first local spatial-flow stabilizer refine it before shared preview/export persistence.
'''
          if old not in s:
              raise SystemExit('analyzer header block not found')
          s = s.replace(old, new, 1)

          old = '''                decodeSinglePriorityFrame(clip, priority)?.let { frame ->
                    worker.enqueueOwned(priority, frame)
                }
'''
          new = '''                decodeSinglePriorityFrame(clip, priority)?.let { frame ->
                    worker.enqueueOwned(priority, frame)
                    // Do not let the next decoder/GL operation overlap Paddle/OpenCL on shared Mali GPU.
                    worker.awaitIdle()
                }
'''
          if old not in s:
              raise SystemExit('priority enqueue block not found')
          s = s.replace(old, new, 1)

          old = '''                ) { sourceUs, bitmap ->
                    worker.enqueueOwned(sourceUs, bitmap)
                }
'''
          new = '''                ) { sourceUs, bitmap ->
                    worker.enqueueOwned(sourceUs, bitmap)
                    // Target UniSOC/Mali drivers can corrupt OES frames when decoder GL and Paddle
                    // OpenCL execute concurrently. Drain inference before the decoder touches GL again.
                    worker.awaitIdle()
                }
'''
          if old not in s:
              raise SystemExit('sequential enqueue block not found')
          s = s.replace(old, new, 1)

          old = '''                        val frame = scaledFrameAtTime(retriever, sourceUs) ?: continue
                        worker.enqueueOwned(sourceUs, frame)
'''
          new = '''                        val frame = scaledFrameAtTime(retriever, sourceUs) ?: continue
                        worker.enqueueOwned(sourceUs, frame)
                        worker.awaitIdle()
'''
          if old not in s:
              raise SystemExit('retriever enqueue block not found')
          s = s.replace(old, new, 1)

          old = '        append(" · direct frame queue")\n'
          new = '        append(" · serialized frame queue")\n'
          if old not in s:
              raise SystemExit('backend queue label not found')
          s = s.replace(old, new, 1)
          analyzer.write_text(s)

          generation = Path('app/src/main/java/com/tajuli/digitorandroid/editor/processing/PersonCutoutGenerationV47.kt')
          g = generation.read_text()
          old = 'private const val V47_GENERATION_VERSION = "adaptive-v57-ppmattingv2-paddle-opencl-gpu-only-fp32-r2"'
          new = 'private const val V47_GENERATION_VERSION = "adaptive-v57-ppmattingv2-paddle-opencl-gpu-only-fp32-r3-serialized-decode"'
          if old not in g:
              raise SystemExit('generation version not found')
          generation.write_text(g.replace(old, new, 1))

          # One-shot workflow: remove itself from the final PR branch.
          Path('.github/workflows/pr57-serialize-cutout-gpu.yml').unlink()
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Serialize Cutout decode and OpenCL inference to stop video corruption'
          git pull --rebase origin perf/ppmattingv2-gpu-128-v57
          git push origin HEAD:perf/ppmattingv2-gpu-128-v57
