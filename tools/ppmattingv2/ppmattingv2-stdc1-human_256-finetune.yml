# Digitor PP-MattingV2/STDC1 true-256 fine-tune profile.
#
# This is intentionally a real 256 training/export profile, not a 512 graph fed with a 256 tensor.
# Start from PaddleSeg's official human-512 checkpoint so the learned matting representation is
# preserved, then adapt the network to the 256x256 operating point used by the mobile Vulkan path.
#
# IMPORTANT 256 specialization:
# PP-MattingV2's default DPP bins are [2, 4, 6]. At a 256x256 input the first pyramid pool produces
# a 4x4 feature map, so the default 6x6 AdaptiveAvgPool asks the exporter/runtime to pool a 4x4 map
# to 6x6. Paddle can serialize that graph, but ONNX consumers (onnxruntime/pnnx) hit SIGFPE on it.
# [2, 3, 4] keeps all pyramid stages <= the 4x4 DPP map while preserving three transformer stages
# and their parameter shapes, so the official 512 checkpoint remains weight-compatible.

batch_size: 16
iters: 20000

train_dataset:
  type: MattingDataset
  dataset_root: data/PPM-100
  train_file: train.txt
  transforms:
    - type: LoadImages
    - type: LimitShort
      max_short: 320
    - type: RandomCrop
      crop_size: [256, 256]
    - type: Padding
      target_size: [256, 256]
    - type: RandomDistort
    - type: RandomBlur
      prob: 0.1
    - type: RandomSharpen
      prob: 0.2
    - type: RandomNoise
      prob: 0.35
    - type: RandomReJpeg
      prob: 0.15
    - type: RandomHorizontalFlip
    - type: Normalize
  mode: train

val_dataset:
  type: MattingDataset
  dataset_root: data/PPM-100
  val_file: val.txt
  transforms:
    - type: LoadImages
    - type: LimitShort
      max_short: 256
    - type: ResizeToIntMult
      mult_int: 32
    - type: Normalize
  mode: val
  get_trimap: False

model:
  type: PPMattingV2
  backbone:
    type: STDC1
    pretrained: https://bj.bcebos.com/paddleseg/dygraph/PP_STDCNet1.tar.gz
  decoder_channels: [128, 96, 64, 32, 16]
  head_channel: 8
  dpp_output_channel: 256
  dpp_merge_type: add
  # 256-safe DPP pyramid: pp1 output is 4x4, therefore no adaptive pool may request >4x4.
  dpp_bin_sizes: [2, 3, 4]
  # tools/train.py treats this as a warm-start checkpoint when present in the config.
  pretrained: pretrained_models/ppmattingv2-stdc1-human_512.pdparams

optimizer:
  type: sgd
  momentum: 0.9
  weight_decay: 5.0e-4

lr_scheduler:
  type: PolynomialDecay
  # Lower LR than the original 512 training recipe to preserve the pretrained edge/detail filters.
  learning_rate: 0.001
  end_lr: 0
  power: 0.9
  warmup_iters: 500
  warmup_start_lr: 1.0e-5
