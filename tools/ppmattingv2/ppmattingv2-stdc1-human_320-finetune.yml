# Digitor PP-MattingV2/STDC1 true-320 profile.
#
# The graph is a genuine fixed [1,3,320,320] mobile operating point. Production export uses the
# proven official human-512 checkpoint as the weight source; the training section is retained only
# for a future validated offline 320 fine-tune.
#
# At 320 input the first DPP feature map is 5x5. Use [2,3,5] so every adaptive-pool target fits that
# map; the default [2,4,6] asks for a 6x6 stage and is not safe for this operating point.

batch_size: 12
iters: 20000

train_dataset:
  type: MattingDataset
  dataset_root: data/PPM-100
  train_file: train.txt
  transforms:
    - type: LoadImages
    - type: LimitShort
      max_short: 384
    - type: RandomCrop
      crop_size: [320, 320]
    - type: Padding
      target_size: [320, 320]
    - type: RandomDistort
    - type: RandomBlur
      prob: 0.1
    - type: RandomSharpen
      prob: 0.2
    - type: RandomNoise
      prob: 0.32
    - type: RandomReJpeg
      prob: 0.13
    - type: RandomHorizontalFlip
    - type: Normalize
  mode: train

val_dataset:
  type: MattingDataset
  dataset_root: data/PPM-100
  val_file: val.txt
  transforms:
    - type: LoadImages
    - type: LimitShort
      max_short: 320
    - type: ResizeToIntMult
      mult_int: 32
    - type: Normalize
  mode: val
  get_trimap: False

model:
  type: PPMattingV2
  backbone:
    type: STDC1
    pretrained: https://bj.bcebos.com/paddleseg/dygraph/PP_STDCNet1.tar.gz
  decoder_channels: [128, 96, 64, 32, 16]
  head_channel: 8
  dpp_output_channel: 256
  dpp_merge_type: add
  dpp_bin_sizes: [2, 3, 5]
  pretrained: pretrained_models/ppmattingv2-stdc1-human_512.pdparams

optimizer:
  type: sgd
  momentum: 0.9
  weight_decay: 5.0e-4

lr_scheduler:
  type: PolynomialDecay
  learning_rate: 0.00085
  end_lr: 0
  power: 0.9
  warmup_iters: 500
  warmup_start_lr: 1.0e-5
