# Digitor PP-MattingV2/STDC1 true-384 fine-tune profile.
#
# This is a genuine 384x384 operating point for the mobile Vulkan path. It is not a 512 graph
# receiving smaller runtime tensors. Start from PaddleSeg's official human-512 checkpoint, then
# fine-tune at 384 so hair/fabric/detail filters adapt to the deployment resolution.
#
# At 384 input the first DPP feature map is 6x6, so PP-MattingV2's original [2, 4, 6] pyramid is
# valid and can be retained without the 256-specific [2, 3, 4] workaround.

batch_size: 8
iters: 20000

train_dataset:
  type: MattingDataset
  dataset_root: data/PPM-100
  train_file: train.txt
  transforms:
    - type: LoadImages
    - type: LimitShort
      max_short: 448
    - type: RandomCrop
      crop_size: [384, 384]
    - type: Padding
      target_size: [384, 384]
    - type: RandomDistort
    - type: RandomBlur
      prob: 0.1
    - type: RandomSharpen
      prob: 0.2
    - type: RandomNoise
      prob: 0.30
    - type: RandomReJpeg
      prob: 0.12
    - type: RandomHorizontalFlip
    - type: Normalize
  mode: train

val_dataset:
  type: MattingDataset
  dataset_root: data/PPM-100
  val_file: val.txt
  transforms:
    - type: LoadImages
    - type: LimitShort
      max_short: 384
    - type: ResizeToIntMult
      mult_int: 32
    - type: Normalize
  mode: val
  get_trimap: False

model:
  type: PPMattingV2
  backbone:
    type: STDC1
    pretrained: https://bj.bcebos.com/paddleseg/dygraph/PP_STDCNet1.tar.gz
  decoder_channels: [128, 96, 64, 32, 16]
  head_channel: 8
  dpp_output_channel: 256
  dpp_merge_type: add
  dpp_bin_sizes: [2, 4, 6]
  pretrained: pretrained_models/ppmattingv2-stdc1-human_512.pdparams

optimizer:
  type: sgd
  momentum: 0.9
  weight_decay: 5.0e-4

lr_scheduler:
  type: PolynomialDecay
  # Conservative LR keeps the 512 checkpoint's learned fine-detail filters while adapting them to
  # the denser 384 ROI operating point.
  learning_rate: 0.00075
  end_lr: 0
  power: 0.9
  warmup_iters: 500
  warmup_start_lr: 1.0e-5
